name: Check Next.js migration
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  next:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Temporary bootstrap until its generated lockfile can be committed.
      - run: npm run setup:next
      - run: npm run test
      - run: npm run build:next
        env:
          SITE_INDEXABLE: 'false'
      - run: npm run typecheck
      - run: npm run test:next
        env:
          SITE_INDEXABLE: 'false'
