name: Check server setup script
on:
  push:
    paths: ['deploy/**', '.github/workflows/check-server-setup.yml']
  pull_request:
    paths: ['deploy/**', '.github/workflows/check-server-setup.yml']
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: bash -n deploy/bootstrap-ubuntu.sh
      - run: bash deploy/bootstrap-ubuntu.sh --check
      - run: shellcheck deploy/bootstrap-ubuntu.sh
      - run: bash -n deploy/install-preview.sh
      - run: bash deploy/install-preview.sh --check
      - run: shellcheck deploy/install-preview.sh
      - run: bash -n deploy/install-live.sh
      - run: bash deploy/install-live.sh --check
      - run: shellcheck deploy/install-live.sh
